<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BCA Mini Project Portal - Authentication</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .auth-container {
      background: #ffffff;
      width: 100%;
      max-width: 420px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
      overflow: hidden;
    }

    .auth-header {
      background: #1e293b;
      color: white;
      text-align: center;
      padding: 24px;
    }

    .auth-header h2 {
      font-size: 1.35rem;
      margin-bottom: 6px;
    }

    .auth-header p {
      font-size: 0.85rem;
      color: #94a3b8;
    }

    .tab-group {
      display: flex;
      border-bottom: 1px solid #e2e8f0;
    }

    .tab-btn {
      flex: 1;
      padding: 14px;
      background: #f8fafc;
      border: none;
      font-weight: 600;
      font-size: 0.95rem;
      color: #64748b;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background: #ffffff;
      color: #2563eb;
      border-bottom: 2px solid #2563eb;
    }

    .auth-body {
      padding: 28px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #334155;
      margin-bottom: 6px;
    }

    .form-group input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-group input:focus {
      border-color: #2563eb;
    }

    .submit-btn {
      width: 100%;
      padding: 12px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s;
    }

    .submit-btn:hover {
      background: #1d4ed8;
    }

    .hidden {
      display: none !important;
    }

    .alert-box {
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      margin-bottom: 14px;
      display: none;
    }

    .alert-error {
      background-color: #fee2e2;
      color: #991b1b;
      border: 1px solid #f87171;
    }

    .alert-success {
      background-color: #dcfce7;
      color: #166534;
      border: 1px solid #86efac;
    }
  </style>
</head>
<body>

  <div class="auth-container">
    <div class="auth-header">
      <h2>Project Portal</h2>
      <p>Mini Project Submission System</p>
    </div>

    <div class="tab-group">
      <button class="tab-btn active" id="loginTabBtn" onclick="switchTab('login')">Login</button>
      <button class="tab-btn" id="registerTabBtn" onclick="switchTab('register')">Register</button>
    </div>

    <div class="auth-body">
      <div id="alertBox" class="alert-box"></div>

      <!-- Login Form (Visible by default) -->
      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="loginEmail">Email Address</label>
          <input type="email" id="loginEmail" placeholder="student@college.edu" required />
        </div>
        <div class="form-group">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" placeholder="••••••••" required />
        </div>
        <button type="submit" class="submit-btn">Log In</button>
      </form>

      <!-- Register Form (Hidden by default) -->
      <form id="registerForm" class="hidden" style="display: none;" onsubmit="handleRegister(event)">
        <div class="form-group">
          <label for="regName"> Username </label>
          <input type="text" id="regName" placeholder=" " required />
        </div>
        <div class="form-group">
          <label for="regEmail">Email Address</label>
          <input type="email" id="regEmail" placeholder="student@college.edu" required />
        </div>
        <div class="form-group">
          <label for="regPassword">Create Password</label>
          <input type="password" id="regPassword" placeholder=" " required />
        </div>
        <button type="submit" class="submit-btn">Create Account</button>
      </form>
    </div>
  </div>

  <script>
    function switchTab(tab) {
      const loginForm = document.getElementById('loginForm');
      const registerForm = document.getElementById('registerForm');
      const loginTabBtn = document.getElementById('loginTabBtn');
      const registerTabBtn = document.getElementById('registerTabBtn');
      const alertBox = document.getElementById('alertBox');
      alertBox.style.display = 'none';

      if (tab === 'login') {
        loginForm.style.display = 'block';
        loginForm.classList.remove('hidden');

        registerForm.style.display = 'none';
        registerForm.classList.add('hidden');

        loginTabBtn.classList.add('active');
        registerTabBtn.classList.remove('active');
      } else {
        loginForm.style.display = 'none';
        loginForm.classList.add('hidden');

        registerForm.style.display = 'block';
        registerForm.classList.remove('hidden');

        loginTabBtn.classList.remove('active');
        registerTabBtn.classList.add('active');
      }
    }

    function showAlert(message, isSuccess = false) {
      const alertBox = document.getElementById('alertBox');
      alertBox.textContent = message;
      alertBox.className = 'alert-box ' + (isSuccess ? 'alert-success' : 'alert-error');
      alertBox.style.display = 'block';
    }

    async function handleRegister(e) {
      e.preventDefault();
      const name = document.getElementById('regName').value;
      const email = document.getElementById('regEmail').value;
      const password = document.getElementById('regPassword').value;

      try {
        const response = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password })
        });
        const data = await response.json();

        if (response.ok) {
          showAlert('Registration successful! Please login.', true);
          switchTab('login');
        } else {
          showAlert(data.message || 'Registration failed.');
        }
      } catch (err) {
        showAlert('Could not connect to the server.');
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;

      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await response.json();

        if (response.ok) {
          localStorage.setItem('userToken', data.token);
          localStorage.setItem('userName', data.name);
          window.location.href = '/dashboard.html';
        } else {
          showAlert(data.message || 'Invalid email or password.');
        }
      } catch (err) {
        showAlert('Could not connect to the server.');
      }
    }
  </script>
</body>
</html>
